<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Phanton Pizza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo" data-eb-editable="text" data-eb-key="contact.h1.1" data-eb-role="h1" data-eb-kind="text">Phanton</h1>
            <nav class="nav" id="nav">
                <ul>
                    <li><a href="index.html" data-eb-editable="link" data-eb-key="contact.a.2" data-eb-role="a" data-eb-kind="link">Inicio</a></li>
                    <li><a href="menu.html" data-eb-editable="link" data-eb-key="contact.a.3" data-eb-role="a" data-eb-kind="link">Menú</a></li>
                    <li><a href="contact.html" class="active" data-eb-editable="link" data-eb-key="contact.a.4" data-eb-role="a" data-eb-kind="link">Contacto</a></li>
                </ul>
            </nav>
            <button class="nav-toggle" aria-label="Abrir menú" id="nav-toggle" data-eb-editable="link" data-eb-key="contact.button.5" data-eb-role="button" data-eb-kind="link">
                <span class="hamburger"></span>
            </button>
        </div>
    </header>

    <section class="place-map">
        <div class="container">
            <h2 data-eb-editable="text" data-eb-key="contact.h2.6" data-eb-role="h2" data-eb-kind="text">Ubicación</h2>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1590204.7511493105!2d-90.0833210465046!3d19.18394339423709!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f5a55d2e2bd4cb3%3A0x18dfb8a962aab997!2sPizzas%20y%20Tacos%20EL%20SUSPIRO!5e1!3m2!1ses-419!2smx!4v1788581362156!5m2!1ses-419!2smx"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
                class="map-iframe"
                aria-label="Mapa de ubicación de Phanton Pizza en Campeche">
            </iframe>
        </div>
    </section>

    <section class="contact-info">
        <div class="container">
            <h2 data-eb-editable="text" data-eb-key="contact.h2.7" data-eb-role="h2" data-eb-kind="text">Contacto</h2>
            <div class="contact-details">
                <div class="contact-item">
                    <span>📞</span>
                    <div>
                        <h3 data-eb-editable="text" data-eb-key="contact.h3.8" data-eb-role="h3" data-eb-kind="text">Teléfono</h3>
                        <p data-eb-editable="text" data-eb-key="contact.p.9" data-eb-role="p" data-eb-kind="text"><a href="tel:1113467889" data-eb-editable="link" data-eb-key="contact.a.10" data-eb-role="a" data-eb-kind="link">1113467889</a></p>
                    </div>
                </div>
                <div class="contact-item">
                    <span>🕒</span>
                    <div>
                        <h3 data-eb-editable="text" data-eb-key="contact.h3.11" data-eb-role="h3" data-eb-kind="text">Horario</h3>
                        <p data-eb-editable="text" data-eb-key="contact.p.12" data-eb-role="p" data-eb-kind="text">Martes a domingo de 7 am a 11 pm</p>
                    </div>
                </div>
                <div class="contact-item">
                    <span>📍</span>
                    <div>
                        <h3 data-eb-editable="text" data-eb-key="contact.h3.13" data-eb-role="h3" data-eb-kind="text">Dirección</h3>
                        <p data-eb-editable="text" data-eb-key="contact.p.14" data-eb-role="p" data-eb-kind="text">Campeche, México</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p data-eb-editable="text" data-eb-key="contact.p.15" data-eb-role="p" data-eb-kind="text">© 2026 Phanton Pizza. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        const navToggle = document.getElementById('nav-toggle');
        const nav = document.getElementById('nav');
        navToggle.addEventListener('click', () => {
            nav.classList.toggle('nav-open');
            navToggle.classList.toggle('open');
        });
        // Header scroll effect
        const header = document.querySelector('.header');
        let lastScroll = 0;
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            if (currentScroll <= 0) {
                header.classList.remove('scroll-down');
                return;
            }
            if (currentScroll > lastScroll && !header.classList.contains('scroll-down')) {
                header.classList.add('scroll-down');
            } else if (currentScroll < lastScroll && header.classList.contains('scroll-down')) {
                header.classList.remove('scroll-down');
            }
            lastScroll = currentScroll;
        });
    </script>
</body>
</html>
