<section class="info-block">
<h2 data-eb-editable="text" data-eb-key="contact.h2.5" data-eb-role="h2" data-eb-kind="text">Información de contacto</h2>
<p data-eb-editable="text" data-eb-key="contact.p.6" data-eb-role="p" data-eb-kind="text"><span data-eb-editable>Teléfono: 1113467889</span></p>
<p data-eb-editable="text" data-eb-key="contact.p.7" data-eb-role="p" data-eb-kind="text"><span data-eb-editable>Horario: martes a domingo de 7 am a 11 pm</span></p>

<section class="map">
<h2 data-eb-editable="text" data-eb-key="contact.h2.9" data-eb-role="h2" data-eb-kind="text">Ubicación</h2>

<h2 data-eb-editable="text" data-eb-key="contact.h2.10" data-eb-role="h2" data-eb-kind="text">Envíanos un mensaje</h2>
<form action="#" method="post">
<label for="name">Nombre:</label>
<input type="text" id="name" name="name" required><br><br>
<label for="email">Correo:</label>
<input type="email" id="email" name="email" required><br><br>
<label for="message">Mensaje:</label>
<textarea id="message" name="message" rows="4" required></textarea><br><br>
<button type="submit" data-eb-editable="link" data-eb-key="contact.button.11" data-eb-role="button" data-eb-kind="link">Enviar</button>
</form>
</section>
