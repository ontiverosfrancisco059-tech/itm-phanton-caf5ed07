<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Phanton Pizza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-logo">Phanton Pizza</div>
    <nav class="nav-links" id="nav-links">
      <a href="index.html" data-eb-editable="link" data-eb-key="contact.a.1" data-eb-role="a" data-eb-kind="link">Home</a>
      <a href="menu.html" data-eb-editable="link" data-eb-key="contact.a.2" data-eb-role="a" data-eb-kind="link">Menu</a>
      <a href="contact.html" data-eb-editable="link" data-eb-key="contact.a.3" data-eb-role="a" data-eb-kind="link">Contact</a>
    </nav>
    <button class="menu-toggle" aria-label="Abrir menú" id="menu-toggle" data-eb-editable="link" data-eb-key="contact.button.4" data-eb-role="button" data-eb-kind="link">
      <span></span><span></span><span></span>
    </button>
  </header>

  <section class="hero-section" id="hero">
    <h1 data-eb-editable="text" data-eb-key="contact.h1.5" data-eb-role="h1" data-eb-kind="text">Contáctanos</h1>
    <p data-eb-editable="text" data-eb-key="contact.p.6" data-eb-role="p" data-eb-kind="text">Llámanos o visitanos</p>
  </section>

  <section class="info-block">
    <div class="card">
      <div class="icon">📍</div>
      <div class="content">
        <h3 data-eb-editable="text" data-eb-key="contact.h3.7" data-eb-role="h3" data-eb-kind="text">Ubicación</h3>
        <p data-eb-editable="text" data-eb-key="contact.p.8" data-eb-role="p" data-eb-kind="text">Campeche, México</p>
      </div>
    </div>
    <div class="card">
      <div class="icon">⏰</div>
      <div class="content">
        <h3 data-eb-editable="text" data-eb-key="contact.h3.9" data-eb-role="h3" data-eb-kind="text">Horario</h3>
        <p data-eb-editable="text" data-eb-key="contact.p.10" data-eb-role="p" data-eb-kind="text">Martes a Domingo: 7 am – 11 pm</p>
      </div>
    </div>
    <div class="card">
      <div class="icon">📞</div>
      <div class="content">
        <h3 data-eb-editable="text" data-eb-key="contact.h3.11" data-eb-role="h3" data-eb-kind="text">Teléfono</h3>
        <p data-eb-editable="text" data-eb-key="contact.p.12" data-eb-role="p" data-eb-kind="text">1113467889</p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div>
      <a href="index.html" data-eb-editable="link" data-eb-key="contact.a.13" data-eb-role="a" data-eb-kind="link">Home</a> |
      <a href="menu.html" data-eb-editable="link" data-eb-key="contact.a.14" data-eb-role="a" data-eb-kind="link">Menu</a> |
      <a href="contact.html" data-eb-editable="link" data-eb-key="contact.a.15" data-eb-role="a" data-eb-kind="link">Contact</a>
    </div>
    <div>&copy; 2026 Phanton Pizza. Todos los derechos reservados.</div>
  </footer>

  <script>
    const toggle = document.getElementById('menu-toggle');
    const nav = document.getElementById('nav-links');
    toggle.addEventListener('click', () => {
      nav.classList.toggle('open');
      const expanded = toggle.getAttribute('aria-expanded') === 'true' || false;
      toggle.setAttribute('aria-expanded', !expanded);
    });
    const header = document.querySelector('.site-header');
    window.addEventListener('scroll', () => {
      header.classList.toggle('scrolled', window.scrollY > 10);
    });
  </script>
</body>
</html>
