<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Phanton</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo" data-eb-editable>phanton</div>
        <nav>
            <ul>
                <li><a href="index.html" data-eb-editable="link" data-eb-key="contacto.a.1" data-eb-role="a" data-eb-kind="link">Inicio</a></li>
                <li><a href="menu.html" data-eb-editable="link" data-eb-key="contacto.a.2" data-eb-role="a" data-eb-kind="link">Menú</a></li>
                <li><a href="contacto.html" aria-current="page" data-eb-editable="link" data-eb-key="contacto.a.3" data-eb-role="a" data-eb-kind="link">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="contacto">
        <h1 data-eb-editable="text" data-eb-key="contacto.h1.4" data-eb-role="h1" data-eb-kind="text">Contacto</h1>

        <!-- Formulario de contacto -->
        <div class="card">
            <h2 data-eb-editable="text" data-eb-key="contacto.h2.5" data-eb-role="h2" data-eb-kind="text">Formulario de contacto</h2>
            <form action="#" method="post">
                <input type="text" name="nombre" placeholder="Tu nombre" required>
                <input type="email" name="email" placeholder="Tu email" required>
                <textarea name="mensaje" placeholder="Tu mensaje" rows="4" required></textarea>
                <button type="submit" data-eb-editable="link" data-eb-key="contacto.button.6" data-eb-role="button" data-eb-kind="link">Enviar</button>
            </form>
        </div>

        <!-- Teléfono y WhatsApp -->
        <div class="card">
            <h2 data-eb-editable="text" data-eb-key="contacto.h2.7" data-eb-role="h2" data-eb-kind="text">Teléfono y WhatsApp</h2>
            <p data-eb-editable="text" data-eb-key="contacto.p.8" data-eb-role="p" data-eb-kind="text">Teléfono: <span data-eb-editable>1113467889</span></p>
            <p data-eb-editable="text" data-eb-key="contacto.p.9" data-eb-role="p" data-eb-kind="text">WhatsApp: <a href="https://wa.me/1113467889" data-eb-editable data-eb-editable="link" data-eb-key="contacto.a.10" data-eb-role="a" data-eb-kind="link">1113467889</a></p>
        </div>

        <!-- Mapa integrado -->
        <div class="card map">
            <h2 data-eb-editable="text" data-eb-key="contacto.h2.11" data-eb-role="h2" data-eb-kind="text">Ubicación</h2>
            <div data-eb-editable>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1590204.7511493105!2d-90.0833210465046!3d19.18394339423709!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f5a55d2e2bd4cb3%3A0x18dfb8a962aab997!2sPizzas%20y%20Tacos%20EL%20SUSPIRO!5e1!3m2!1ses-419!2smx!4v1788581362156!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>

        <!-- Horario de atención -->
        <div class="card">
            <h2 data-eb-editable="text" data-eb-key="contacto.h2.12" data-eb-role="h2" data-eb-kind="text">Horario de atención</h2>
            <p data-eb-editable data-eb-editable="text" data-eb-key="contacto.p.13" data-eb-role="p" data-eb-kind="text">martes a domingo de 7 am a 11 pm</p>
        </div>
    </section>

    <footer>
        <p data-eb-editable="text" data-eb-key="contacto.p.14" data-eb-role="p" data-eb-kind="text">© 2026 Phanton. Todos los derechos reservados.</p>
    </footer>

</html>
