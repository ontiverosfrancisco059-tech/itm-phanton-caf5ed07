<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Phanton - Contacto</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header class="container">
    <div class="logo">Phanton</div>
    <nav>
      <ul>
        <li><a href="index.html" aria-current="page" data-eb-editable="link" data-eb-key="contacto.a.1" data-eb-role="a" data-eb-kind="link">Inicio</a></li>
        <li><a href="menu.html" data-eb-editable="link" data-eb-key="contacto.a.2" data-eb-role="a" data-eb-kind="link">Menú</a></li>
        <li><a href="contacto.html" data-eb-editable="link" data-eb-key="contacto.a.3" data-eb-role="a" data-eb-kind="link">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section>
      <h2 data-eb-editable="text" data-eb-key="contacto.h2.4" data-eb-role="h2" data-eb-kind="text">Información de contacto</h2>
      <p data-eb-editable="text" data-eb-key="contacto.p.5" data-eb-role="p" data-eb-kind="text"><strong>Teléfono:</strong> <span data-eb-editable>1113467889</span></p>
      <p data-eb-editable="text" data-eb-key="contacto.p.6" data-eb-role="p" data-eb-kind="text"><strong>Horario:</strong> <span data-eb-editable>martes a domingo de 7 am a 11 pm</span></p>
      <p data-eb-editable="text" data-eb-key="contacto.p.7" data-eb-role="p" data-eb-kind="text"><strong>Dirección:</strong> <span data-eb-editable></span></p>
    </section>

    <section>
      <h2 data-eb-editable="text" data-eb-key="contacto.h2.8" data-eb-role="h2" data-eb-kind="text">Formulario de consulta</h2>
      <form class="contact-form" action="#" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu consulta..."></textarea>
        <button type="submit" data-eb-editable="link" data-eb-key="contacto.button.9" data-eb-role="button" data-eb-kind="link">Enviar</button>
      </form>
    </section>

    <section>
      <h2 data-eb-editable="text" data-eb-key="contacto.h2.10" data-eb-role="h2" data-eb-kind="text">Mapa de ubicación</h2>
      <div class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1590204.7511493105!2d-90.0833210465046!3d19.18394339423709!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f5a55d2e2bd4cb3%3A0x18dfb8a962aab997!2sPizzas%20y%20Tacos%20EL%20SUSPIRO!5e1!3m2!1ses-419!2smx!4v1788581362156!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>

    <section>
      <h2 data-eb-editable="text" data-eb-key="contacto.h2.11" data-eb-role="h2" data-eb-kind="text">Redes sociales</h2>
      <p data-eb-editable="text" data-eb-key="contacto.p.12" data-eb-role="p" data-eb-kind="text">No disponible</p>
    </section>
  </main>

  <footer class="container">
    <p data-eb-editable="text" data-eb-key="contacto.p.13" data-eb-role="p" data-eb-kind="text">&copy; <span data-eb-editable>2026</span> Phanton. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
